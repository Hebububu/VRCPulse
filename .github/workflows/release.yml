name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-action/setup@v1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: cargo test --all

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action/setup@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app (macOS universal)
        if: matrix.platform == 'macos-latest'
        working-directory: desktop
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo tauri build --target universal-apple-darwin

      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: cargo tauri build

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop
        run: cargo tauri build

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p artifacts
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg artifacts/ || true
          cp target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz artifacts/ || true

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p artifacts
          cp target/release/bundle/deb/*.deb artifacts/ || true
          cp target/release/bundle/rpm/*.rpm artifacts/ || true
          cp target/release/bundle/appimage/*.AppImage artifacts/ || true

      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p artifacts
          cp target/release/bundle/nsis/*.exe artifacts/ || true
          cp target/release/vrcpulse-desktop.exe artifacts/VRCPulse-portable.exe || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List artifacts
        run: find all-artifacts -type f

      - name: Generate latest.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"

          cat > all-artifacts/latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${GITHUB_REF_NAME}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "url": "${BASE_URL}/VRCPulse.app.tar.gz",
                "signature": ""
              },
              "darwin-x86_64": {
                "url": "${BASE_URL}/VRCPulse.app.tar.gz",
                "signature": ""
              },
              "linux-x86_64": {
                "url": "${BASE_URL}/VRCPulse.AppImage",
                "signature": ""
              },
              "windows-x86_64": {
                "url": "${BASE_URL}/VRCPulse-portable.exe",
                "signature": ""
              }
            }
          }
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VRCPulse ${{ github.ref_name }}
          files: all-artifacts/*
          generate_release_notes: true
