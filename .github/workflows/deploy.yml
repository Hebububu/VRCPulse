name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.web -t vrcpulse-web:latest .

      - name: Save Docker image
        run: |
          docker save vrcpulse-web:latest | gzip > vrcpulse-web.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: vrcpulse-web.tar.gz
          target: /tmp/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Load new image
            docker load < /tmp/vrcpulse-web.tar.gz
            rm -f /tmp/vrcpulse-web.tar.gz

            # Stop old container if running
            docker stop vrcpulse-web 2>/dev/null || true
            docker rm vrcpulse-web 2>/dev/null || true

            # Start new container
            docker run -d \
              --name vrcpulse-web \
              --restart unless-stopped \
              -p 80:80 \
              -v vrcpulse-data:/data \
              vrcpulse-web:latest

            # Clean up old images
            docker image prune -f

            echo "Deployed successfully"
