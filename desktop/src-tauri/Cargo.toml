[package]
name = "vrcpulse-desktop"
version = "1.0.0"
description = "VRCPulse Desktop - VRChat server status monitor"
authors = ["Hebububu"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vrcpulse_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
vrcpulse-core = { path = "../../crates/vrcpulse-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio = { version = "1.48.0", features = ["full"] }
sea-orm = { version = "1.1.19", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
